theme: jekyll-theme-architect

# Site settings
title: Shuguang Dou
email: doushuguang52@163.com
description: Shuguang Dou — Multimodal Lead at Huawei's Intelligent Healthcare Lab. Research in multimodal intelligence, efficient learning, and trustworthy visual understanding.
baseurl: ""
url: "https://shuguang-52.github.io"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - docs
  - vendor
  - node_modules
  - .bundle

include:
  - .htaccess
  - _pages

sass:
  sass_dir: _sass

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false



# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links
