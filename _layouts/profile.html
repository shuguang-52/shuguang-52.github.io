<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f7f5ef">
  <title>{{ page.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/images/profiel_pic.jpg' | absolute_url }}">
  <link rel="icon" type="image/png" href="{{ "/images/favicon.png" | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/profile.css' | relative_url }}">
  <script src="{{ '/assets/js/profile.js' | relative_url }}" defer></script>
</head>
<body class="profile-site">
  <a class="skip-link" href="#main-content">Skip to content</a>
  {% include profile-header.html %}
  <div class="profile-shell">
    <aside class="profile-sidebar" aria-label="Researcher profile">
      <div class="profile-identity">
        <a class="portrait-link" href="{{ '/' | relative_url }}" aria-label="Shuguang Dou, home">
          <img class="profile-portrait" src="{{ '/images/profiel_pic.jpg' | relative_url }}" alt="Shuguang Dou" width="160" height="200">
        </a>
        <div>
          <p class="profile-name"><a href="{{ '/' | relative_url }}">Shuguang<br class="name-break"> Dou<span class="profile-name-cn" lang="zh-Hans">窦曙光</span></a></p>
          <p class="profile-role">Multimodal Lead<br><span>Intelligent Healthcare Lab</span></p>
          <p class="profile-affiliation">Huawei · Shanghai, China</p>
        </div>
      </div>
      <ul class="profile-links" aria-label="Contact and profiles">
        <li><a href="https://scholar.google.com/citations?user=n2YT06EAAAAJ&amp;hl=en">Google Scholar <span aria-hidden="true">↗</span></a></li>
        <li><a href="https://github.com/shuguang-52">GitHub <span aria-hidden="true">↗</span></a></li>
        <li><a href="{{ '/papers/Resume_ShuguangDou.pdf' | relative_url }}">CV archive <span class="link-note">PDF</span></a></li>
      </ul>
      <div class="profile-contact">
        <p class="eyebrow">Get in touch</p>
        <a href="mailto:doushuguang@huawei.com">doushuguang@huawei.com</a>
        <a href="mailto:doushuguang52@163.com">doushuguang52@163.com</a>
      </div>
    </aside>
    <main id="main-content" class="profile-main" tabindex="-1">
      {{ content }}
    </main>
  </div>
  {% include profile-footer.html %}
</body>
</html>
